<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rack</title>
  <style>
    :root { color-scheme: dark; --ink:#f3efe6; --mute:#9a958b; --card:#1b1916; --line:#2e2b26; --gold:#d4b37a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #11100e; color: var(--ink); }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.5rem 2rem; border-bottom: 1px solid var(--line); }
    h1 { font-weight: 500; margin: 0; letter-spacing: .02em; }
    .total { font-size: 1.6rem; color: var(--gold); }
    main { padding: 1.5rem 2rem 4rem; max-width: 1100px; }
    form { display: flex; gap: .75rem; align-items: center; margin: 1rem 0 2rem; flex-wrap: wrap; }
    input, button, select { font: inherit; padding: .45rem .7rem; background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    button { cursor: pointer; }
    .muted { color: var(--mute); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border: 1px solid var(--line); padding: 1rem; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
    .pair img, .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #000; }
    .price { font-size: 1.4rem; color: var(--gold); margin: .4rem 0; }
    a { color: var(--gold); }
    .comps a { display: block; font-size: .9rem; margin: .15rem 0; }
    .warn { color: #e0c08a; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Rack</h1>
    <div class="total">$<span id="total">0</span> of inventory</div>
  </header>
  <main>
    <p class="muted">Photograph the closet. Get a priced storefront.</p>
    <form id="upload">
      <input type="file" name="photos" accept="image/*" multiple required />
      <button type="submit">Upload pile</button>
    </form>
    <form id="domain">
      <input id="domainQuery" placeholder="store name" />
      <button type="submit">Search domain</button>
      <select id="domainPick"></select>
      <button id="registerBtn" type="button">Register + go live</button>
      <a id="shopLink" href="#" target="_blank"></a>
    </form>
    <p id="status" class="muted"></p>
    <div id="grid" class="grid"></div>
  </main>
  <script>
    let storeId, batchId;
    async function boot() {
      const r = await fetch('/api/demo');
      const j = await r.json();
      storeId = j.storeId;
      document.getElementById('shopLink').href = '/shop/' + storeId;
      document.getElementById('shopLink').textContent = 'Open storefront';
    }
    function imgByKind(images, kind) {
      const hit = (images || []).find(i => i.kind === kind && i.url);
      return hit ? hit.url : null;
    }
    function catalog(images, original) {
      return imgByKind(images, 'ON_MODEL') || imgByKind(images, 'STUDIO') || imgByKind(images, 'RELIT') || imgByKind(images, 'CUTOUT') || original;
    }
    async function refresh() {
      if (!batchId) return;
      const r = await fetch('/api/batches/' + batchId);
      const b = await r.json();
      document.getElementById('total').textContent = b.totalEstimatedValue ?? 0;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (const item of b.items) {
        const d = await fetch('/api/items/' + item.id + '/detail').then(x => x.json());
        const before = item.sourceImageUrl;
        const after = catalog(d.images, before);
        const p = d.price;
        const comps = (p && p.comps ? p.comps : []).slice(0, 3).map(c =>
          `<a href="${c.sourceUrl}" target="_blank">${c.source} · $${c.price}</a>`
        ).join('');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="pair">
            <img src="${before}" alt="before" />
            <img src="${after}" alt="after" />
          </div>
          <p>${d.item.displayBrand ?? '…'} ${d.item.identifiedType ?? ''}</p>
          <p class="muted">${d.item.status}${p && p.demand ? ' · ' + p.demand : ''}</p>
          <p class="price">${p && p.suggested != null ? '$' + p.suggested : 'pricing…'}</p>
          <p class="muted">${p && p.rangeLow != null ? p.rangeLow + '–' + p.rangeHigh : ''} ${p && p.retailNew != null ? ' · retail $' + p.retailNew : ''}</p>
          ${p && p.warning ? `<p class="warn">${p.warning}</p>` : ''}
          <div class="comps">${comps}</div>
          <form data-id="${item.id}" class="brand">
            <input name="brand" value="${d.item.displayBrand ?? ''}" placeholder="correct brand" />
            <button type="submit">Save</button>
          </form>`;
        grid.appendChild(card);
      }
      grid.querySelectorAll('form.brand').forEach(f => {
        f.addEventListener('submit', async (e) => {
          e.preventDefault();
          const id = f.dataset.id;
          const brand = new FormData(f).get('brand');
          await fetch('/api/items/' + id + '/brand?brand=' + encodeURIComponent(brand), { method: 'PATCH' });
        });
      });
    }
    document.getElementById('upload').addEventListener('submit', async (e) => {
      e.preventDefault();
      const files = e.target.photos.files;
      const fd = new FormData();
      fd.append('storeId', storeId);
      for (const f of files) fd.append('photos', f);
      document.getElementById('status').textContent = 'uploading…';
      const r = await fetch('/api/batches', { method: 'POST', body: fd });
      const b = await r.json();
      if (!r.ok) { document.getElementById('status').textContent = b.error || 'upload failed'; return; }
      batchId = b.id;
      document.getElementById('status').textContent = 'batch ' + batchId + ' — identify + price run when your logic is in';
      refresh();
    });
    document.getElementById('domain').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = document.getElementById('domainQuery').value;
      const r = await fetch('/api/domains/search?query=' + encodeURIComponent(q), { method: 'POST' });
      const names = await r.json();
      const sel = document.getElementById('domainPick');
      sel.innerHTML = names.map(n => `<option>${n}</option>`).join('');
    });
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const domain = document.getElementById('domainPick').value;
      if (!domain) return;
      const r = await fetch('/api/domains/register?storeId=' + storeId + '&domain=' + encodeURIComponent(domain), { method: 'POST' });
      const j = await r.json();
      document.getElementById('status').textContent = r.ok ? 'live as ' + j.domain : (j.error || 'register failed');
    });
    boot().then(() => setInterval(refresh, 4000));
  </script>
</body>
</html>

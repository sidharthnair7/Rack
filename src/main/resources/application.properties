spring.application.name=rack

spring.datasource.url=jdbc:postgresql://localhost:5432/rack
spring.datasource.username=rack
spring.datasource.password=rack

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=80MB

# ON. This was switched off after the saved cutout appeared to still contain the bedspread, and
# that reading was wrong: `sod` returns a PNG whose alpha marks the background, while the original
# pixels remain in the RGB channels underneath. Writing those bytes to a .jpg dropped the mask and
# the background reappeared, so the stage looked like a no-op when it had worked correctly.
# ImagingService now composites the result onto white before storing it. Verified against a live
# call: 24% of the returned image is fully transparent and the garment comes back cleanly cut out.
rack.imaging.background-removal=true
# OFF, and this one is not a preference. Measured on a black bomber jacket: the cutout came back
# at average RGB (52,53,62), and after `lighting` it was (126,133,143). The stage raised mean
# brightness 56 -> 134, turning a black jacket grey, and every downstream surface inherits that:
# the catalog image, and the try-on, which faithfully renders whatever garment it is handed. The
# product's whole claim is that what you see is the piece you photographed, so a stage that
# rewrites the colour of the garment costs more than the lighting it fixes. It also cost ~6s of
# the ~31s a single item took end to end.
rack.imaging.lighting=false
rack.imaging.enhance=true
# ai-studio is OFF deliberately, not because it is broken. Its templates are themed *portrait*
# scenes (female_pink_bunny, male_neon_bokeh, female_disco_dust, ...) fetched live from
# /s2s/v2.0/task/template/ai-studio - it stages a person in a styled setting, it is not a clean
# product backdrop. Running a flat garment through it produces nonsense. Background removal
# already yields the clean cutout this stage was assumed to provide.
rack.imaging.studio=false
rack.imaging.try-on=true

rack.tasks.poller-enabled=true
# 1s. Stages chain inline (see TaskPoller#advanceChain), so this only governs how fast the FIRST
# stage is picked up after an upload and how quickly work orphaned by a restart is recovered.
# It was 3s, which is up to three seconds of a completely idle progress bar at the one moment the
# user is watching hardest: right after they hit upload and nothing has visibly happened yet.
rack.tasks.poll-interval-ms=1000

rack.storage.local-dir=uploads

# Secret-bearing keys (serpapi.api-key, perfectcorp.api-key, namecom.username/token,
# namecom.storefront-ip, stripe.secret-key, llm.api-key) are deliberately NOT declared here,
# even as blank. An explicit `key=` line — even empty — is itself a value, and a defined empty
# string here silently wins over an env var or a .env-sourced value for the same property,
# which is exactly the failure mode that made a real key in .env get ignored. Leaving the
# property entirely absent from this file lets it fall through to whatever supplies it
# (a real OS env var in production, .env locally via spring-dotenv) and every *Properties
# record's hasKey()/hasCreds() already treats "absent" the same as "blank".

rack.serpapi.cache-dir=cache/serpapi
rack.serpapi.cache-only=false
rack.perfectcorp.base-url=https://yce-api-01.makeupar.com
rack.namecom.base-url=https://api.dev.name.com
rack.stripe.base-url=https://api.stripe.com
rack.stripe.currency=usd

rack.demo.seed=true

# Behind Caddy the app listens on localhost:8080 while the browser talks to https://rackai.store.
# Without this Spring rebuilds request URLs from the socket it was served on, decides a same-origin
# request is cross-origin, and answers "403 Invalid CORS request" on every upload. It also fixes any
# absolute URL the app generates, which would otherwise point at localhost:8080.
server.forward-headers-strategy=FRAMEWORK

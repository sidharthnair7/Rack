# Zero-infrastructure profile: no Docker, no Postgres.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# Everything else (uploads, cache, vendor keys) behaves exactly as in the default profile.
# Data is in-memory and disappears on restart, which is what you want while iterating.

spring.datasource.url=jdbc:h2:mem:rack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2
